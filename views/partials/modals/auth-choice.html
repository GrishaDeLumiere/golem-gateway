<!-- Модальное окно выбора способа авторизации -->
<div class="modal-overlay" id="authChoiceModal" onclick="closeModal(event)">
  <div class="modal" style="max-width: 520px;" onclick="event.stopPropagation()">
    <div class="modal-header" style="margin-bottom: 20px; border-bottom: none; padding-bottom: 0;">
      <h2>Способ авторизации</h2>
      <button class="close-btn" onclick="closeModal(event)">×</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">

      <!-- Карточка 1: Автоматически (Новое окно) -->
      <div class="gemini-acc-card" style="margin: 0; align-items: flex-start;" onclick="window.app.accounts.startAutoAuth()">
        <div class="setting-icon" style="background: rgba(97, 92, 237, 0.15); color: var(--accent); border: none; margin-top: 2px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
        </div>
        <div class="gemini-acc-info" style="margin-left: 16px;">
          <h4 style="font-size: 16px; margin-bottom: 6px;">Новое окно (Автоматически)</h4>
          <p class="gemini-status" style="white-space: normal; line-height: 1.5; font-size: 13px;">
            Ядро откроет чистый изолированный браузер. Вам останется только войти в свой аккаунт.
          </p>
        </div>
      </div>

      <!-- Карточка 2: Ручной (Свой браузер) -->
      <div class="gemini-acc-card" style="margin: 0; align-items: flex-start;" onclick="window.app.accounts.startManualAuth()">
        <div class="setting-icon" style="background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: none; margin-top: 2px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
        </div>
        <div class="gemini-acc-info" style="margin-left: 16px;">
          <h4 style="font-size: 16px; margin-bottom: 6px;">Ваш браузер (Вручную)</h4>
          <p class="gemini-status" style="white-space: normal; line-height: 1.5; font-size: 13px;">
            Вы получите код скрипта. Скопируйте его и вставьте в консоль (F12) вашего личного браузера.
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
