<!-- Модальное окно Проверки Обновления -->
<div class="modal-overlay" id="updateModal" onclick="closeModal(event)">
  <div class="modal" style="max-width: 660px;" onclick="event.stopPropagation()">

    <!-- Шапка в едином стиле -->
    <div class="modal-header" style="margin-bottom: 20px;">
      <h2>
        <div class="setting-icon" style="width: 36px; height: 36px; border-radius: 10px; background: rgba(97, 92, 237, 0.15); border-color: rgba(97, 92, 237, 0.3); color: var(--accent);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
        <span data-i18n="upd_title">Обновление системы</span>
      </h2>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="btn-icon" onclick="checkUpdateModal()" title="Проверить снова" style="width: 32px; height: 32px; border-radius: 50%;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>
    </div>

    <!-- Карточка статуса и сравнения версий -->
    <div id="updateStatusBanner" class="settings-card" style="flex-direction: column; align-items: stretch; gap: 16px; padding: 18px 20px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.025);">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div id="updateLoader" style="display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <div class="spinner-ring" style="width: 24px; height: 24px; border-width: 2.5px;"></div>
        </div>
        <div id="updateStatusDot" class="pulse-dot auth" style="display: none; flex-shrink: 0;"></div>
        <p id="updateMessageText" style="color: var(--text); font-size: 14px; font-weight: 500; margin: 0; line-height: 1.4;" data-i18n="upd_loading">
          Связываемся с сервером...
        </p>
      </div>

      <!-- Плашки версий -->
      <div id="updateVersions" style="display: none; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 10px; padding: 12px 16px;">
        <div>
          <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 4px;" data-i18n="upd_cur_ver">Текущая версия</div>
          <div id="verCurrent" style="font-family: 'Consolas', monospace; font-size: 16px; font-weight: 600; color: var(--text);">...</div>
        </div>

        <div style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: rgba(255, 255, 255, 0.04); color: var(--text-muted);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>

        <div style="text-align: right;">
          <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 4px;" data-i18n="upd_new_ver">Доступная версия</div>
          <div id="verLatest" style="font-family: 'Consolas', monospace; font-size: 16px; font-weight: 600; color: var(--success);">...</div>
        </div>
      </div>
    </div>

    <!-- Секция истории изменений с нормальными табами -->
    <div id="changelogContainer" style="display: none; margin-bottom: 24px;">
      <div class="gemini-tabs" style="margin-bottom: 14px;">
        <button type="button" id="tabCommitsBtn" class="gemini-tab-btn active" onclick="window.app.updater.switchLogTab('commits')" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="1.05" y1="12" x2="7" y2="12"></line>
            <line x1="17.01" y1="12" x2="22.96" y2="12"></line>
          </svg>
          <span data-i18n="upd_tab_commits">Коммиты</span>
        </button>
        <button type="button" id="tabReleasesBtn" class="gemini-tab-btn" onclick="window.app.updater.switchLogTab('releases')" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
            <line x1="7" y1="7" x2="7.01" y2="7"></line>
          </svg>
          <span data-i18n="upd_tab_releases">Релизы</span>
        </button>
      </div>

      <div style="background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 14px; box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);">
        <div id="changelogContent" class="custom-scroll" style="max-height: 250px; overflow-y: auto; padding-right: 6px;"></div>
        <div id="releasesContent" class="custom-scroll" style="max-height: 250px; overflow-y: auto; padding-right: 6px; display: none;"></div>
      </div>
    </div>

    <!-- Нижняя панель с понятными кнопками -->
    <div id="updateActions" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; border-top: 1px solid var(--border); opacity: 0; transition: opacity 0.25s; pointer-events: none;">
      <button type="button" class="btn btn-flat" style="width: auto; padding: 10px 20px; margin: 0;" onclick="closeModal()" data-i18n="upd_btn_close">
        Закрыть
      </button>

      <div style="display: flex; align-items: center; gap: 10px;">
        <!-- Кнопка принудительной переустановки (когда версия уже актуальна) -->
        <button type="button" class="btn btn-secondary" id="forceUpdateDiv" style="width: auto; padding: 10px 18px; margin: 0; display: none;" onclick="openUpdaterWindow()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <span data-i18n="upd_btn_force">Принудительная переустановка файлов</span>
        </button>

        <!-- Главная кнопка установки апдейта (когда вышла новая версия) -->
        <button type="button" class="btn btn-primary-solid" id="startUpdateBtn" style="width: auto; padding: 10px 22px; margin: 0; display: none;" onclick="openUpdaterWindow()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px;">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span data-i18n="upd_btn_download">Скачать и установить</span>
        </button>
      </div>
    </div>

  </div>
</div>
